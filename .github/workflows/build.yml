name: Build macOS App

on:
  push:
    branches: [main]
  workflow_dispatch:

# release 任务需要创建 tag 和 Release
permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14   # Apple Silicon (M 系列)，与目标设备一致
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Inject build version into Info.plist
        id: ver
        # CFBundleVersion 注入为 run 号，App 内显示版本与 Release tag 对应：
        # 设置页/接口显示 "x.y.z (N)"，tag 为 vx.y.z-build.N
        run: |
          BASE=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" Info.plist)
          /usr/libexec/PlistBuddy -c "Set CFBundleVersion ${GITHUB_RUN_NUMBER}" Info.plist
          echo "base=${BASE}" >> "$GITHUB_OUTPUT"
          echo "tag=v${BASE}-build.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "注入版本: ${BASE} (${GITHUB_RUN_NUMBER})"

      - name: Toolchain info
        run: |
          swift --version
          sw_vers

      - name: Fix git auth for SPM dependency fetch
        # macOS runner 的全局 git 配置挂了 osxkeychain，其中残留失效的 github.com 凭据，
        # 导致匿名 clone 公共依赖返回 401；清空 helper 并擦除钥匙串条目，恢复匿名访问
        run: |
          git config --global --unset-all credential.helper || true
          git config --global credential.helper ""
          printf "protocol=https\nhost=github.com\n\n" | git credential-osxkeychain erase || true

      - name: Resolve Swift packages
        run: swift package resolve

      - name: Build (release)
        run: swift build -c release

      - name: Run tests
        run: swift test

      - name: Bundle DocuMind.app
        run: bash scripts/build-app.sh

      - name: Verify bundled version
        run: /usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" dist/DocuMind.app/Contents/Info.plist && /usr/libexec/PlistBuddy -c "Print CFBundleVersion" dist/DocuMind.app/Contents/Info.plist

      - name: Package app as zip
        run: ditto -c -k --sequesterRsrc --keepParent dist/DocuMind.app dist/DocuMind-macOS.zip

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: DocuMind-macOS-app
          path: dist/DocuMind-macOS.zip
          retention-days: 14

      - name: Upload zip for release job
        uses: actions/upload-artifact@v4
        with:
          name: release-payload
          path: dist/DocuMind-macOS.zip
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build payload
        uses: actions/download-artifact@v4
        with:
          name: release-payload
          path: dist

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ needs.build.outputs.tag }}" -m "Release ${{ needs.build.outputs.tag }}"
          git push origin "${{ needs.build.outputs.tag }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: DocuMind ${{ needs.build.outputs.tag }}
          files: dist/DocuMind-macOS.zip
          generate_release_notes: true
          make_latest: true
