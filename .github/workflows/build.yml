name: Build macOS App

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14   # Apple Silicon (M 系列)，与目标设备一致
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Toolchain info
        run: |
          swift --version
          sw_vers

      - name: Configure git for SPM dependency fetch
        # runner 的钥匙串里可能有失效凭据导致匿名 clone 公共仓库返回 401，
        # 用 GITHUB_TOKEN 显式重写 github.com 的 https 访问
        run: git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Resolve Swift packages
        run: swift package resolve

      - name: Build (release)
        run: swift build -c release

      - name: Run tests
        run: swift test

      - name: Bundle DocuMind.app
        run: bash scripts/build-app.sh

      - name: Package app as zip
        run: ditto -c -k --sequesterRsrc --keepParent dist/DocuMind.app dist/DocuMind-macOS.zip

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: DocuMind-macOS-app
          path: dist/DocuMind-macOS.zip
          retention-days: 14
