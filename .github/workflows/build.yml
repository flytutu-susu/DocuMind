name: Build macOS App

on:
  push:
    branches: [main]
  workflow_dispatch:

# release 任务需要创建 tag 和 Release
permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14   # Apple Silicon (M 系列)，与目标设备一致
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Toolchain info
        run: |
          swift --version
          sw_vers

      - name: Fix git auth for SPM dependency fetch
        # macOS runner 的全局 git 配置挂了 osxkeychain，其中残留失效的 github.com 凭据，
        # 导致匿名 clone 公共依赖返回 401；清空 helper 并擦除钥匙串条目，恢复匿名访问
        run: |
          git config --global --unset-all credential.helper || true
          git config --global credential.helper ""
          printf "protocol=https\nhost=github.com\n\n" | git credential-osxkeychain erase || true

      - name: Resolve Swift packages
        run: swift package resolve

      - name: Build (release)
        run: swift build -c release

      - name: Run tests
        run: swift test

      - name: Bundle DocuMind.app
        run: bash scripts/build-app.sh

      - name: Package app as zip
        run: ditto -c -k --sequesterRsrc --keepParent dist/DocuMind.app dist/DocuMind-macOS.zip

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: DocuMind-macOS-app
          path: dist/DocuMind-macOS.zip
          retention-days: 14

      - name: Upload zip for release job
        uses: actions/upload-artifact@v4
        with:
          name: release-payload
          path: dist/DocuMind-macOS.zip
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute version tag
        id: ver
        run: |
          # 从 Info.plist 提取 CFBundleShortVersionString（grep/sed 跨平台，不依赖 macOS 的 PlistBuddy）
          VERSION=$(grep -A1 "<key>CFBundleShortVersionString</key>" Info.plist | grep -o "<string>[^<]*</string>" | head -1 | sed -e 's/<string>//' -e 's/<\/string>//')
          VERSION=${VERSION:-1.0.0}
          TAG="v${VERSION}-build.${GITHUB_RUN_NUMBER}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Download build payload
        uses: actions/download-artifact@v4
        with:
          name: release-payload
          path: dist

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.ver.outputs.tag }}" -m "Release ${{ steps.ver.outputs.tag }}"
          git push origin "${{ steps.ver.outputs.tag }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: DocuMind ${{ steps.ver.outputs.tag }}
          files: dist/DocuMind-macOS.zip
          generate_release_notes: true
          make_latest: true
